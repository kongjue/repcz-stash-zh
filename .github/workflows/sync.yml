name: 同步上游并生成中文版

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装 YAML 校验依赖
        run: python -m pip install -r requirements.txt
      - name: 获取同一提交的模板和规则并汉化
        env:
          DESTINATION_REPOSITORY: ${{ github.repository }}
        run: python scripts/sync_upstream.py --repository "$DESTINATION_REPOSITORY"
      - name: 校验翻译和引用
        run: python -m unittest discover -s tests -v
      - name: 有变化时提交
        run: |
          git add -- Stash upstream LICENSE
          if git diff --cached --quiet; then
            echo "上游无变化，无需提交。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Repcz Stash rules and Chinese template'
          git push origin HEAD:main
